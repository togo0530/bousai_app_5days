{% extends "base.html" %}

{% block content %}
<div class="panel map-card">
  <h2 class="section-title"><span class="location-dot"></span>避難所マップ</h2>
  <div class="map-frame">
    <div id="shelterMap"></div>
  </div>
</div>

<div class="panel weather-card">
  <div class="weather-header">
    <div class="weather-title"><span class="weather-icon" aria-hidden="true"></span>青森市 気象警報・注意報</div>
    <div class="refresh-badge"><span class="refresh-icon" aria-hidden="true"></span>10分おき自動更新</div>
  </div>

  <div id="weatherContent" class="weather-body">
    <div class="warning-line">現在、警報・注意報は発表されていません</div>
    <ul class="meta-list">
      <li>データ取得時間: 2025年06月05日 11:56</li>
      <li>気象庁発表: 2025年06月04日 21:08</li>
    </ul>
  </div>
</div>

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
document.addEventListener('DOMContentLoaded', function() {
    const map = L.map('shelterMap', { zoomControl: false }).setView([40.8244, 140.7400], 12);
    L.control.zoom({ position: 'topleft' }).addTo(map);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
        attribution: '© OpenStreetMap contributors',
        referrerPolicy: 'strict-origin-when-cross-origin'
    }).addTo(map);

    function updateWeatherWarnings() {
        fetch('/api/weather_warnings')
            .then(response => response.json())
            .then(data => {
                updateWeatherContent(data);
            })
            .catch(() => {
                document.getElementById('weatherContent').innerHTML = `
                    <div class="warning-line">現在、警報・注意報は発表されていません</div>
                    <ul class="meta-list">
                      <li>データ取得時間: 取得失敗</li>
                      <li>気象庁発表: 取得失敗</li>
                    </ul>
                `;
            });
    }

    function updateWeatherContent(data) {
        const weatherContent = document.getElementById('weatherContent');

        if (data.error) {
            weatherContent.innerHTML = `
                <div class="warning-line">現在、警報・注意報は発表されていません</div>
                <ul class="meta-list">
                  <li>データ取得時間: 取得失敗</li>
                  <li>気象庁発表: 取得失敗</li>
                </ul>
            `;
            return;
        }

        let warningMessage = '現在、警報・注意報は発表されていません';
        if (data.warnings && data.warnings.length > 0) {
            warningMessage = data.warnings.map(w => `${w.name}（${w.status}）`).join('、');
        }

        weatherContent.innerHTML = `
            <div class="warning-line">${warningMessage}</div>
            <ul class="meta-list">
              <li>データ取得時間: ${data.last_fetch_time || '更新中...'}</li>
              <li>気象庁発表: ${data.report_time || '不明'}</li>
            </ul>
        `;
    }

    updateWeatherWarnings();
    setInterval(updateWeatherWarnings, 600000);
});
</script>
{% endblock %}
