{% extends "base.html" %}

{% block content %}
<h2>検索結果</h2>

{% if results %}
  <ul>
    {% for shelter in results %}
    <li>
      {{ shelter.name }}
      {% if session.get('logged_in') %}
        <form method="post" action="{{ url_for('delete_shelter', shelter_id=shelter.id) }}" style="display:inline; margin-left: 10px;">
          <button type="submit" onclick="return confirm('この避難所を削除しますか？');">削除</button>
        </form>
      {% endif %}
    </li>
    {% endfor %}
  </ul>
{% else %}
  <p>該当する避難所が見つかりませんでした</p>
{% endif %}

<p>
  <a href="/shelter_search">検索画面に戻る</a> |
  <a href="/">トップページへ戻る</a>
</p>
{% endblock %}
