{% extends "base.html" %}

{% block content %}
<style>
  .search-page {
    max-width: 980px;
    margin: 0 auto;
    padding: 8px 0 30px;
  }
  .search-box {
    background: #ffffff;
    border: 2px solid #1f2937;
    border-radius: 12px;
    padding: 24px;
    box-shadow: 0 4px 14px rgba(15, 23, 42, 0.05);
  }
  .search-title {
    margin: 0 0 18px;
    font-size: 32px;
    color: #0f172a;
  }
  .search-form {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    align-items: flex-end;
  }
  .field {
    display: flex;
    flex-direction: column;
    gap: 8px;
    min-width: 220px;
  }
  .field label {
    font-weight: 700;
    color: #0f172a;
  }
  .field select,
  .field button {
    padding: 12px 16px;
    border-radius: 10px;
    border: 1px solid #1f2937;
    font-size: 15px;
  }
  .field select {
    background: #fff;
    min-width: 220px;
  }
  .field button {
    background: #dbeafe;
    font-weight: 700;
    cursor: pointer;
  }
  .inline-link {
    margin-top: 18px;
    display: inline-block;
    color: #1d4ed8;
    font-weight: 700;
    text-decoration: none;
  }
  .result-panel {
    margin-top: 26px;
    background: #f8fafc;
    border: 1px solid rgba(148,163,184,0.5);
    border-radius: 12px;
    padding: 18px;
  }
</style>

<div class="search-page">
  <div class="search-box">
    <h2 class="search-title">避難所検索</h2>

    <form class="search-form" method="get" action="/search_results">
      <div class="field">
        <label for="district">地区</label>
        <select id="district" name="district">
          <option value="">全地区</option>
          <option value="青森市">青森市</option>
          <option value="中央区">中央区</option>
          <option value="東区">東区</option>
          <option value="西区">西区</option>
        </select>
      </div>
      <div class="field">
        <button type="submit">検索</button>
      </div>
    </form>

    <a class="inline-link" href="/all_shelters">全施設一覧を見る</a>
  </div>

  <div class="result-panel">
    <p>検索後は、避難所名・住所・開設状況を一覧で確認できます。</p>
  </div>
</div>
{% endblock %}
